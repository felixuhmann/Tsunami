# SPDX-License-Identifier: GPL-3.0-or-later
name: RVox native product build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rvox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: rvox-native-${{ matrix.os }} (hosted RVox core; RVox product editor)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build prerequisites (ephemeral runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libxi-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev xvfb openbox x11-utils
      - name: Select CPython 3.11 for pinned host wheels
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Configure pinned AGPL JUCE 9.0.4 and newest CLAP wrapper
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTSUNAMI_BUILD_FIXTURE=OFF -DTSUNAMI_BUILD_RVOX=ON
      - name: Build actual RVox native format modules, hosted adapter and editor tests
        run: cmake --build build --config Release --target rvox_adapter_test rvox_editor_test TsunamiRVox_VST3 TsunamiRVox_CLAP --parallel 2
      - name: CTest
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ctest --test-dir build -C Release -R '^rvox\.(adapter|editor)$' --output-on-failure
          else
            ctest --test-dir build -C Release -R '^rvox\.(adapter|editor)$' --output-on-failure
          fi
      - name: Native CLAP protocol, audio and state validation (upstream mature validator)
        run: |
          mkdir -p evidence validator
          if [[ "$RUNNER_OS" == Linux ]]; then
            asset=clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
            digest=49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90
            executable=validator/clap-validator
          else
            asset=clap-validator-0.4.1-127-g152b982-windows.zip
            digest=d935c3af0a45c3911ea2e900f4aa5d6709dac82bb485f0c4ce28648ab2cd0c10
            executable=validator/clap-validator.exe
          fi
          curl -fL --retry 2 "https://github.com/free-audio/clap-validator/releases/download/0.4.1/$asset" -o validator.zip
          printf '%s  validator.zip\n' "$digest" | sha256sum -c -
          python -c "import zipfile; zipfile.ZipFile('validator.zip').extractall('validator')"
          if [[ "$RUNNER_OS" == Linux ]]; then
            tar -xzf validator/*.tar.gz -C validator
          fi
          chmod +x "$executable"
          "$executable" --version | tee evidence/clap-validator-version.txt
          plugin="$(python -c "from pathlib import Path; print(next(Path('build/TsunamiRVox_artefacts').rglob('*.clap')).resolve())")"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a "$executable" validate --json --jobs 2 "$plugin" > evidence/clap-validator.json
          else
            "$executable" validate --json --jobs 2 "$plugin" > evidence/clap-validator.json
          fi
      - name: Download hash-locked mature Linux editor host
        if: runner.os == 'Linux'
        run: |
          mkdir -p editor-host
          curl -fL --retry 2 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip -o editor-host/pluginval.zip
          printf '%s  editor-host/pluginval.zip\n' c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352 | sha256sum -c -
          python -c "import zipfile; zipfile.ZipFile('editor-host/pluginval.zip').extractall('editor-host')"
          chmod +x editor-host/pluginval
          editor-host/pluginval --version
      - name: Install hash-locked mature host wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/host-requirements.txt
      - name: Native VST3 render, state and rate/block matrix (Windows also opens the editor)
        run: |
          mkdir -p evidence
          plugin="$(python -c "from pathlib import Path; print(next(Path('build/TsunamiRVox_artefacts').rglob('Tsunami RVox.vst3')).resolve())")"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Audio/state only here; the attached editor is captured by the next step.
            timeout 90 xvfb-run -a -s '-screen 0 1600x1000x24' python tests/foundation/host_smoke.py "$plugin" evidence
          else
            python tests/foundation/host_smoke.py "$plugin" evidence --capture
          fi
      - name: Linux attached RVox editor capture (pluginval 1.0.4, Xvfb; 371 px view)
        if: runner.os == 'Linux'
        env:
          RVOX_EDITOR_MIN_WIDTH: '360'
        run: |
          plugin="$(python -c "from pathlib import Path; print(next(Path('build/TsunamiRVox_artefacts').rglob('Tsunami RVox.vst3')).resolve())")"
          timeout 90 xvfb-run -a -s '-screen 0 1600x1000x24' python tests/rvox/linux_editor_capture.py "$plugin" evidence/ui "$PWD/editor-host/pluginval"
          python -c "from PIL import Image; im=Image.open('evidence/ui/host-editor.png'); print('editor', im.size); assert im.size[0] >= 360"
      - name: Matching corresponding source and notices beside experimental binaries
        if: always()
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD -o evidence/project-source.tar
          if [[ -d build/_deps/juce-src && -d build/_deps/clap_juce-src ]]; then
            tar --exclude=.git -cf evidence/dependency-source.tar -C build/_deps juce-src clap_juce-src
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md dependencies.lock.json evidence/
          cp -r LICENSES evidence/
          git rev-parse HEAD > evidence/checkout-sha.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > evidence/pr-head-sha.txt
      - name: Retain exact build bytes and diagnostic evidence (not a release)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rvox-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/TsunamiRVox_artefacts/Release/VST3/
            build/TsunamiRVox_artefacts/Release/CLAP/
            build/Testing/Temporary/
            evidence/
          if-no-files-found: error
          retention-days: 14
